<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHREE SHYAM POLYMERS PVT. LTD. - Quality Plastic Solutions Since 2003</title>
    <meta name="description"
        content="Leading plastic manufacturer in Nepal since 2003. Providing quality HDPE pipes, garbage bags, mulch films, and more for agriculture, packaging, and industrial use." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Critical inline CSS: prevents white flash BEFORE external CSS loads -->
    <style>
        html, body { background: #121212 !important; margin: 0; padding: 0; }
    </style>

    <!-- Theme init: applies correct theme class before React mounts -->
    <script>
        (function(){
            try {
                var t = localStorage.getItem('theme') || 'dark';
                if (t !== 'dark') {
                    document.documentElement.style.background = '#FFF9F5';
                    document.body && (document.body.style.background = '#FFF9F5');
                }
            } catch(e){}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gzstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
</head>

<body class="dark-mode">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
